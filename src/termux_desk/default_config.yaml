# termux-desktop configuration defaults.
#
# desk parses this built-in document when no user file exists, so the
# comments below document the defaults. Run 'desk config init' to copy a
# starting point to the path printed by 'desk config path', then edit it or
# use 'desk config set ...'; desk never rewrites the file on its own.
#
# Only 'version', 'apps', 'vnc', 'ime', 'fonts', and 'skin' are accepted.
# Application overrides are keyed by
# CONTAINER/APP; each entry may set program, args_prefix and environment.
# Quote values that YAML would misread as syntax (for example ':1').

version: 1

# Application overrides, keyed by CONTAINER/APP.
#
# Each entry can set:
#   program      replace the program token of the container desktop entry
#   args_prefix  arguments inserted after the program
#   environment  environment variables passed through proot
#
# Example:
#
#   "ubuntu-desktop-test/com.microsoft.VSCode":
#     program: /usr/local/bin/code
#     environment:
#       GTK_IM_MODULE: xim
apps: {}

# VNC defaults used when a command omits the flag. A per-command flag wins.
vnc:
  display: ":1"
  geometry: "1280x720"
  depth: 24
  host: "127.0.0.1"
  port: 6080
  proxy: rs
  view_only: false

# auto: use ibus when it is installed; true: require it when installed;
# false: never inject the input method environment.
ime:
  enabled: auto

# auto: follow the Android system language. The family keys replace the
# detected font for that generic family; both are only read by `desk setup`.
fonts:
  language: auto
  # sans_serif: "Noto Sans CJK SC"
  # serif: "Noto Serif CJK SC"
  # monospace: "Noto Sans Mono CJK SC"

# Optional skin selected by this configuration. desk applies it only when you
# run 'desk skin apply' (desk start only prints a hint). A skin is one manifest
# with an appearance section and a layout section.
# skin: nord-dark
