# termux-desktop configuration defaults.
#
# desk parses this built-in document when no user file exists, so the
# comments below document the defaults. Run 'desk config init' to copy a
# starting point to the path printed by 'desk config path', then edit it or
# use 'desk config set app ...'; desk never rewrites the file on its own.
#
# Only 'version' and 'apps' are accepted. Application overrides are keyed by
# CONTAINER/APP; each entry may set program, args_prefix and environment.
# Quote values that YAML would misread as syntax (for example ':1').

version: 1

# Application overrides, keyed by CONTAINER/APP.
#
# Each entry can set:
#   program      replace the program token of the container desktop entry
#   args_prefix  arguments inserted after the program
#   environment  environment variables passed through proot
#
# Example:
#
#   "ubuntu-desktop-test/com.microsoft.VSCode":
#     program: /usr/local/bin/code
#     environment:
#       GTK_IM_MODULE: xim
apps: {}
