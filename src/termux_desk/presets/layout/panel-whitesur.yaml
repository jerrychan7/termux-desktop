layout: panel-whitesur

# Top bar plus a centered dock, the arrangement the Modern skin uses.
xfwm4:
  inactive_opacity: 92
  workspace_count: 2
  workspace_names:
    - "1"
    - "2"
panels:
  - position: top
    size: 32
    length: 100
    plugins:
      - type: whiskermenu
        settings:
          button-icon: "applications-all"
          launcher-show-name: false
          show-command-logout: false
      - type: pager
        settings:
          numbering: false
      - type: separator
        settings:
          expand: true
          style: 0
      - type: notification-plugin
      - type: systray
        settings:
          square-icons: true
      - type: clock
        settings:
          digital-layout: 3
          digital-time-format: "%H:%M"
  - position: bottom-center
    size: 56
    length: auto
    plugins:
      - type: separator
        settings:
          style: 0
      - type: launcher
        items:
          - thunar.desktop
      - type: launcher
        items:
          - xfce4-terminal.desktop
      - type: launcher
        items:
          - xfce4-settings-manager.desktop
      - type: separator
        settings:
          style: 0
      - type: showdesktop
      - type: tasklist
        settings:
          show-labels: false
