layout: panel-nord
description: Basic Style（Nordic-darker + kora 图标） 的面板布局
panels:
  - position: bottom
    size: 44
    length: 100
    plugins:
      - type: whiskermenu
        settings:
          button-icon: "distributor-logo-blackarch"
          button-single-row: false
          category-icon-size: 2
          favorites-in-recent: true
          hover-switch-category: true
          launcher-icon-size: 2
          launcher-show-name: true
          menu-height: 640
          menu-opacity: 95
          menu-width: 540
          position-categories-alternate: true
          position-categories-horizontal: false
          position-commands-alternate: false
          position-profile-alternate: true
          profile-shape: 0
          show-command-logout: false
          show-command-settings: true
          show-command-shutdown: true
          view-mode: 1
      - type: separator
        settings:
          expand: false
          style: 2
      - type: tasklist
        settings:
          flat-buttons: false
          grouping: 1
          middle-click: 2
          show-handle: false
          show-labels: false
          show-only-minimized: false
          sort-order: 1
      - type: separator
        settings:
          expand: true
          style: 0
      - type: systray
        settings:
          square-icons: true
      - type: pager
        settings:
          miniature-view: false
          rows: 1
          wrap-workspaces: false
      - type: xfce4-clipman-plugin
      - type: notification-plugin
      - type: clock
        settings:
          mode: 2
      - type: showdesktop
