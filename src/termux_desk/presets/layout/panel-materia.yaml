layout: panel-materia
description: Minimalist Setup 1（Materia-Manjaro + Bibata 光标） 的面板布局
xfwm4:
  inactive_opacity: 92
  workspace_count: 2
  workspace_names:
    - "1"
    - "2"
panels:
  - position: top
    size: 44
    length: 100
    plugins:
      - type: whiskermenu
        settings:
          button-icon: "applications-all"
          button-single-row: false
          category-icon-size: 2
          default-category: 2
          hover-switch-category: true
          launcher-icon-size: 4
          launcher-show-name: true
          menu-height: 600
          menu-opacity: 0
          menu-width: 600
          position-categories-alternate: true
          position-categories-horizontal: true
          position-commands-alternate: false
          position-profile-alternate: false
          position-search-alternate: false
          profile-shape: 2
          show-command-logout: false
          show-command-menueditor: true
          show-command-shutdown: true
          view-mode: 0
      - type: systray
        settings:
          square-icons: true
      - type: separator
        settings:
          expand: true
          style: 0
      - type: clock
        settings:
          flash-separators: false
          mode: 4
          show-inactive: false
          show-meridiem: false
          show-military: false
      - type: separator
        settings:
          expand: true
          style: 0
      - type: screenshooter
      - type: xfce4-clipman-plugin
      - type: notification-plugin
      - type: pager
        settings:
          miniature-view: false
          numbering: false
          rows: 1
          workspace-scrolling: true
          wrap-workspaces: false
      - type: separator
        settings:
          style: 0
      - type: separator
        settings:
          style: 0
  - position: bottom-center
    size: 61
    length: auto
    plugins:
      - type: whiskermenu
        settings:
          button-icon: "applications-all"
          button-single-row: false
          menu-height: 600
          menu-opacity: 0
          menu-width: 600
          position-categories-alternate: true
      - type: separator
      - type: launcher
        items: [thunar.desktop]
      - type: launcher
        items: [xfce4-terminal.desktop]
      - type: launcher
        items: [xfce-settings-manager.desktop]
      - type: launcher
        items: [xfce-display-settings.desktop]
      - type: launcher
        items: [xfce-keyboard-settings.desktop]
      - type: launcher
        items: [xfce4-about.desktop]
      - type: separator
      - type: showdesktop
      - type: tasklist
        settings:
          flat-buttons: true
          include-all-workspaces: true
          show-handle: false
          show-labels: false
          show-tooltips: true
          show-wireframes: true
          window-scrolling: false
