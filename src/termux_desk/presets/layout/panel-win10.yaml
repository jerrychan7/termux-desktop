layout: panel-win10
description: Windows 10 的面板布局：底部任务栏，左侧开始与搜索，中间任务按钮，右侧托盘与时钟
xfwm4:
  borderless_maximize: true
  button_layout: "|SHMC"
  full_width_title: true
  placement_mode: center
  show_app_icon: false
  title_alignment: center

xsettings:
  decoration_layout: ":minimize,maximize,close"
  sync_themes: true

desktop:
  show_filesystem: false

shortcuts:
  "<Primary>Escape": xfdesktop --menu
  "<Primary><Alt>f": thunar
  "<Primary><Alt>l": xflock4
  "<Primary><Alt>t": exo-open --launch TerminalEmulator
  "<Primary><Shift>Escape": xfce4-taskmanager
  "<Super>e": thunar
  "<Super>p": xfce4-display-settings --minimal
  "<Super>r": xfce4-appfinder -c

window_shortcuts:
  "<Super>KP_Down": tile_down_key
  "<Super>KP_Left": tile_left_key
  "<Super>KP_Right": tile_right_key
  "<Super>KP_Up": tile_up_key

panels:
  - position: bottom
    size: 44
    length: 100
    length-adjust: true
    icon-size: 24
    plugins:
      - type: whiskermenu
        settings:
          button-icon: gnome-main-menu
          button-single-row: false
          button-title: ""
          category-icon-size: 2
          category-show-name: true
          default-category: 0
          favorites-in-recent: false
          hover-switch-category: true
          launcher-icon-size: 4
          launcher-show-name: true
          launcher-show-tooltip: true
          menu-height: 710
          menu-opacity: 95
          menu-width: 678
          position-categories-alternate: true
          position-categories-horizontal: false
          position-commands-alternate: true
          position-profile-alternate: false
          position-search-alternate: true
          show-command-logout: false
          show-command-shutdown: true
          view-mode: 0
      - type: launcher
        items:
          - thunar.desktop
      - type: launcher
        items:
          - xfce4-terminal.desktop
      - type: launcher
        items:
          - xfce4-settings-manager.desktop
      - type: separator
        settings:
          expand: true
          style: 0
      - type: tasklist
        settings:
          grouping: 1
          show-handle: false
          show-labels: true
      - type: separator
        settings:
          style: 0
      - type: systray
        settings:
          square-icons: true
      - type: xfce4-clipman-plugin
      - type: notification-plugin
      - type: clock
        settings:
          mode: 2
          digital-layout: 3
          digital-time-format: "%l:%M %P"
          digital-date-format: "%m/%d/%Y"
      - type: showdesktop
