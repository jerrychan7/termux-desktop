theme: materia-bibata
description: Minimalist Setup 1（Materia + Bibata 光标；需先构建主题）
packages:
  - xfce4-whiskermenu-plugin
  - xfce4-clipman-plugin
  - xfce4-screenshooter
components:
  gtk: Materia-dark
  xfwm: Materia-dark
  icons: Tela-circle-dracula
  cursors: Bibata-Modern-Ice
assets:
  - kind: theme
    target: Materia-dark
    path: ~/.local/share/termux-desktop/builds/materia/Materia-dark
  - kind: icons
    target: Tela-circle-dracula
    path: ~/.local/share/termux-desktop/builds/tela/Tela-circle-dracula
  - kind: cursors
    target: Bibata-Modern-Ice
    pick: Bibata-Modern-Ice
    url: https://github.com/ful1e5/Bibata_Cursor/releases/download/v2.0.7/Bibata-Modern-Ice.tar.xz
    sha256: a68cae60c4dc706350e194ebc91c5fe48bc7bc9d59e119555834a2a7ee5078ef
