# Build recipe for the WhiteSur icon theme (vinceliuice/WhiteSur-icon-theme).
# Run with: desk skin build <this file> --yes
build: whitesur-icons
container: ubuntu
source:
  url: https://github.com/vinceliuice/WhiteSur-icon-theme/archive/2026-09-10.tar.gz
  sha256: 406c9cd59705583f1754b0eaca96cc48bafda042b88ef143f16d8ae1820ecd95
packages: []
commands:
  - mkdir -p /tmp/desk-build/whitesur-icons/out
  - ./install.sh -t all -d /tmp/desk-build/whitesur-icons/out
artifacts:
  - path: tmp/desk-build/whitesur-icons/out/WhiteSur
    kind: icons
    target: WhiteSur
  - path: tmp/desk-build/whitesur-icons/out/WhiteSur-purple
    kind: icons
    target: WhiteSur-purple
  - path: tmp/desk-build/whitesur-icons/out/WhiteSur-pink
    kind: icons
    target: WhiteSur-pink
  - path: tmp/desk-build/whitesur-icons/out/WhiteSur-red
    kind: icons
    target: WhiteSur-red
  - path: tmp/desk-build/whitesur-icons/out/WhiteSur-orange
    kind: icons
    target: WhiteSur-orange
  - path: tmp/desk-build/whitesur-icons/out/WhiteSur-yellow
    kind: icons
    target: WhiteSur-yellow
  - path: tmp/desk-build/whitesur-icons/out/WhiteSur-green
    kind: icons
    target: WhiteSur-green
  - path: tmp/desk-build/whitesur-icons/out/WhiteSur-grey
    kind: icons
    target: WhiteSur-grey
  - path: tmp/desk-build/whitesur-icons/out/WhiteSur-nord
    kind: icons
    target: WhiteSur-nord
