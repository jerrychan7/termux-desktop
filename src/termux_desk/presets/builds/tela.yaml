# Build recipe for the Tela-circle icon theme (vinceliuice/Tela-circle-icon-theme).
# Run with: desk skin build <this file> --yes
build: tela
container: ubuntu
source:
  url: https://github.com/vinceliuice/Tela-circle-icon-theme/archive/refs/tags/2026-07-07.tar.gz
  sha256: 0a8aee6e95f19ff96cc497d804c75e2af4271a5e6472c55891fb8ac5b099b59b
packages:
  - libgtk-3-bin
commands:
  - ./install.sh -a -d /tmp/desk-build/tela/out
artifacts:
  - path: tmp/desk-build/tela/out/Tela-circle
    kind: icons
    target: Tela-circle
  - path: tmp/desk-build/tela/out/Tela-circle-dark
    kind: icons
    target: Tela-circle-dark
  - path: tmp/desk-build/tela/out/Tela-circle-light
    kind: icons
    target: Tela-circle-light
  - path: tmp/desk-build/tela/out/Tela-circle-dracula
    kind: icons
    target: Tela-circle-dracula
  - path: tmp/desk-build/tela/out/Tela-circle-nord
    kind: icons
    target: Tela-circle-nord
  - path: tmp/desk-build/tela/out/Tela-circle-manjaro
    kind: icons
    target: Tela-circle-manjaro
  - path: tmp/desk-build/tela/out/Tela-circle-ubuntu
    kind: icons
    target: Tela-circle-ubuntu
  - path: tmp/desk-build/tela/out/Tela-circle-black
    kind: icons
    target: Tela-circle-black
  - path: tmp/desk-build/tela/out/Tela-circle-blue
    kind: icons
    target: Tela-circle-blue
  - path: tmp/desk-build/tela/out/Tela-circle-brown
    kind: icons
    target: Tela-circle-brown
  - path: tmp/desk-build/tela/out/Tela-circle-green
    kind: icons
    target: Tela-circle-green
  - path: tmp/desk-build/tela/out/Tela-circle-grey
    kind: icons
    target: Tela-circle-grey
  - path: tmp/desk-build/tela/out/Tela-circle-orange
    kind: icons
    target: Tela-circle-orange
  - path: tmp/desk-build/tela/out/Tela-circle-pink
    kind: icons
    target: Tela-circle-pink
  - path: tmp/desk-build/tela/out/Tela-circle-purple
    kind: icons
    target: Tela-circle-purple
  - path: tmp/desk-build/tela/out/Tela-circle-red
    kind: icons
    target: Tela-circle-red
  - path: tmp/desk-build/tela/out/Tela-circle-yellow
    kind: icons
    target: Tela-circle-yellow
