id: whitesur
name: WhiteSur
summary: "macOS-like desktop built from the WhiteSur and Lavanda themes, the WhiteSur and Colloid-Purple icon themes, Fluent cursors and the Mononoki Nerd Font."
layout: panel-whitesur
notes: |
  主题与图标都要先构建（desk skin build），因为上游只发源码：WhiteSur 走 whitesur-theme / whitesur-icons，
  Lavanda 走 lavanda-theme，Colloid-Purple 走 colloid-icons。
  Colloid 的 -Dark 与不带后缀的变体在上游是指向 Colloid-Purple-Light 目录的软链，构建配方把这些跨目录软链
  换成真实目录，因此三个变体都能单独安装。WhiteSur 的 -light/-dark 同样是指向同族目录的软链，这里仍只收
  9 套基础配色。
  光标里 Fluent 直接取上游仓库里已经渲染好的 Xcursor 文件，volantes 需要构建（inkscape 与 xcursorgen）。
  字体只收 Mononoki Nerd Font 的三个字族，每个字族装一个 Regular 文件，因为安装器一次只写一个字体文件。
  Lavanda 的 Sea 设计没有收：它换的是另一套配色，参考外观里没有用到。

defaults:
  theme: WhiteSur-Dark
  icons: WhiteSur
  cursors: Fluent-dark-cursors
  font: Mononoki Nerd Font

themes:
  - name: WhiteSur-Dark
    path: ~/.local/share/termux-desktop/builds/whitesur-theme/WhiteSur-Dark
