id: whitesur
name: WhiteSur
summary: "macOS-like desktop built from the WhiteSur theme and icon theme."
layout: panel-whitesur
notes: |
  主题与图标都需要先构建（desk skin build），因为上游仓库只给源码。
  图标的 -light/-dark 变体只是指向同族目录的软链，不能单独安装，这里只收 9 套基础配色。

defaults:
  theme: WhiteSur-Dark
  icons: WhiteSur

themes:
  - name: WhiteSur-Dark
    path: ~/.local/share/termux-desktop/builds/whitesur-theme/WhiteSur-Dark
  - name: WhiteSur-Dark-hdpi
    path: ~/.local/share/termux-desktop/builds/whitesur-theme/WhiteSur-Dark-hdpi
  - name: WhiteSur-Dark-xhdpi
    path: ~/.local/share/termux-desktop/builds/whitesur-theme/WhiteSur-Dark-xhdpi
  - name: WhiteSur-Dark-solid
    path: ~/.local/share/termux-desktop/builds/whitesur-theme/WhiteSur-Dark-solid
  - name: WhiteSur-Dark-solid-hdpi
    path: ~/.local/share/termux-desktop/builds/whitesur-theme/WhiteSur-Dark-solid-hdpi
  - name: WhiteSur-Dark-solid-xhdpi
    path: ~/.local/share/termux-desktop/builds/whitesur-theme/WhiteSur-Dark-solid-xhdpi
  - name: WhiteSur-Light
    path: ~/.local/share/termux-desktop/builds/whitesur-theme/WhiteSur-Light
  - name: WhiteSur-Light-hdpi
    path: ~/.local/share/termux-desktop/builds/whitesur-theme/WhiteSur-Light-hdpi
  - name: WhiteSur-Light-xhdpi
    path: ~/.local/share/termux-desktop/builds/whitesur-theme/WhiteSur-Light-xhdpi
  - name: WhiteSur-Light-solid
    path: ~/.local/share/termux-desktop/builds/whitesur-theme/WhiteSur-Light-solid
  - name: WhiteSur-Light-solid-hdpi
    path: ~/.local/share/termux-desktop/builds/whitesur-theme/WhiteSur-Light-solid-hdpi
  - name: WhiteSur-Light-solid-xhdpi
    path: ~/.local/share/termux-desktop/builds/whitesur-theme/WhiteSur-Light-solid-xhdpi

icons:
  - name: WhiteSur
    path: ~/.local/share/termux-desktop/builds/whitesur-icons/WhiteSur
  - name: WhiteSur-purple
    path: ~/.local/share/termux-desktop/builds/whitesur-icons/WhiteSur-purple
  - name: WhiteSur-pink
    path: ~/.local/share/termux-desktop/builds/whitesur-icons/WhiteSur-pink
  - name: WhiteSur-red
    path: ~/.local/share/termux-desktop/builds/whitesur-icons/WhiteSur-red
  - name: WhiteSur-orange
    path: ~/.local/share/termux-desktop/builds/whitesur-icons/WhiteSur-orange
  - name: WhiteSur-yellow
    path: ~/.local/share/termux-desktop/builds/whitesur-icons/WhiteSur-yellow
  - name: WhiteSur-green
    path: ~/.local/share/termux-desktop/builds/whitesur-icons/WhiteSur-green
  - name: WhiteSur-grey
    path: ~/.local/share/termux-desktop/builds/whitesur-icons/WhiteSur-grey
  - name: WhiteSur-nord
    path: ~/.local/share/termux-desktop/builds/whitesur-icons/WhiteSur-nord

packages:
  - xfce4-whiskermenu-plugin
