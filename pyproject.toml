# 开发工具配置。这个文件不参与运行时，也不用于打包发布。
# 开发在 Ubuntu 环境进行，运行时在 Termux；这里只约束两边共用的源码。

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["scripts/frozen"]

[tool.ruff.lint]
# 先只启用低噪声的规则：语法错误、未定义/未使用名字、导入排序。
# SIM/UP/B 等规则在后续单元里逐步评估，不一次性打开。
select = ["E4", "E7", "E9", "F", "I"]
# 一行多条语句在 tests/benchmarks 里很常见，留给后续的 ruff format 统一处理。
ignore = ["E701", "E702"]

[tool.pylint.main]
py-version = "3.10"
# 只保留错误与结构规模检查；风格规则交给 ruff，避免两套规则互相打架。
disable = ["all"]
enable = ["E", "too-many-lines", "too-many-branches", "too-many-statements"]

[tool.pylint.design]
max-module-lines = 1000
max-branches = 12
max-statements = 50
